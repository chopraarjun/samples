[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artifact-access-audit"
version = "0.1.0"
description = "Artifact access audit service for Cloudsmith take-home exercise"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "pytz>=2024.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "black>=25.1.0",
    "isort>=6.0.0",
    "flake8>=7.2.0",
    "flake8-bugbear>=24.12.0",
    "pre-commit>=4.0.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '/(\.venv|build|dist)/'

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]
known_first_party = ["audit_service"]

[project.scripts]
audit-ingest = "audit_service.backend.processing.ingestion.ingest:main"
audit-split-input = "audit_service.backend.processing.ingestion.split_input:main"
audit-reset = "audit_service.backend.processing.reset.cli:main"
audit-retention = "audit_service.backend.processing.retention:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
