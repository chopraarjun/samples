<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .step { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .decision { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .ok { fill: #f0fdf4; stroke: #16a34a; }
      .bad { fill: #fef2f2; stroke: #dc2626; }
      .label { font-size: 12px; fill: #0f172a; font-weight: 600; }
      .sub { font-size: 11px; fill: #475569; }
      .line { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <text x="20" y="28" class="title">Ingest flow (per landing file)</text>
  <rect x="250" y="45" width="220" height="50" class="step"/>
  <text x="360" y="75" text-anchor="middle" class="label">collect_pending_files</text>
  <rect x="250" y="120" width="220" height="50" class="step"/>
  <text x="360" y="145" text-anchor="middle" class="label">touch .processing marker</text>
  <rect x="250" y="195" width="220" height="60" class="step"/>
  <text x="360" y="220" text-anchor="middle" class="label">read JSONL line-by-line</text>
  <text x="360" y="238" text-anchor="middle" class="sub">Pydantic -&gt; EventRecord</text>
  <rect x="80" y="290" width="180" height="70" class="step ok"/>
  <text x="170" y="320" text-anchor="middle" class="label">valid event</text>
  <text x="170" y="340" text-anchor="middle" class="sub">in-file dedupe by event_id</text>
  <rect x="440" y="290" width="200" height="90" class="step bad"/>
  <text x="540" y="318" text-anchor="middle" class="label">reject -&gt; DLQ</text>
  <text x="540" y="336" text-anchor="middle" class="sub">source_file, line_number</text>
  <text x="540" y="354" text-anchor="middle" class="sub">raw_line, reason</text>
  <rect x="80" y="400" width="220" height="70" class="step ok"/>
  <text x="190" y="430" text-anchor="middle" class="label">partition upsert</text>
  <text x="190" y="450" text-anchor="middle" class="sub">merge + row_number dedupe</text>
  <rect x="360" y="400" width="220" height="70" class="step"/>
  <text x="470" y="430" text-anchor="middle" class="label">touch .processed marker</text>
  <text x="470" y="450" text-anchor="middle" class="sub">file stays in landing/</text>
  <path d="M360 95 L360 120" class="line"/>
  <path d="M360 170 L360 195" class="line"/>
  <path d="M300 255 L170 290" class="line"/>
  <path d="M420 255 L540 290" class="line"/>
  <path d="M170 360 L190 400" class="line"/>
  <path d="M300 435 L360 435" class="line"/>
  <text x="248" y="278" class="sub">valid</text>
  <text x="430" y="278" class="sub">malformed / invalid</text>
</svg>
